target:
  base_url: "https://dev-api.insigmind.com"
  timeout: 360000

log:
  level: "info"
  encoding: "json"
  output: "./logs/pipet.log"

test:
  report_dir: "./reports"
  test_case_dir:
    - "./testcases"
  data_dir: "./sql"
  severe_status:
    - 500
  global_pre: []   # 全局前置条件测试用例ID列表（所有测试执行前运行）
  global_post: []  # 全局后置条件测试用例ID列表（所有测试执行后运行）
  device_name: "" # 测试设备名称，为空时自动使用主机名
  rounds: 1       # 多轮测试次数，默认为1（单次测试）
  interval_ms: 0  # 轮间间隔时间（毫秒），默认为0
  schedule_interval_minutes: 30  # 定时执行测试间隔（分钟），0 表示不启用

http:
  insecure_skip_verify: true

